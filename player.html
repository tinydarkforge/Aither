<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Video Player - Aither</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/src/styles/vars.css">
  <link rel="stylesheet" href="/src/styles/player.css">
  <link rel="stylesheet" href="/src/styles/error-handler.css">
</head>
<body class="player-page">
  <div class="player-container">
    <!-- Video Player -->
    <div class="video-wrapper">
      <!-- Start Video Overlay (appears on first load) -->
      <div id="startOverlay" class="start-overlay">
        <button id="startVideoBtn" class="start-video-btn">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="white" stroke="white" stroke-width="2">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <span>Start Video</span>
        </button>
      </div>

      <!-- Overlay QR Scan Button -->
      <button id="overlayQrBtn" class="overlay-qr-btn" title="Scan Another QR Code" style="display: none;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
      </button>
      <video
        id="videoPlayer"
        class="video-player"
        controls
        playsinline
        preload="metadata"
        webkit-playsinline
        x5-playsinline
        x5-video-player-type="h5"
        x5-video-player-fullscreen="true"
        x5-video-orientation="landscape"
      >
        <p>Your browser doesn't support HTML5 video.</p>
      </video>
    </div>

    <!-- Video Info -->
    <div class="video-info">
      <h1 class="video-title" id="videoTitle">Video</h1>
      <p class="video-description" id="videoDescription"></p>
      <p class="video-url" id="videoUrl"></p>
      <button id="scanQrBtn" class="scan-qr-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        Scan Another QR
      </button>
    </div>

    <!-- Error Message -->
    <div id="errorMessage" class="error-container" style="display: none;">
      <div class="error-icon">⚠️</div>
      <h2>Video Not Found</h2>
      <p>No video URL was provided. Please scan a valid QR code.</p>
    </div>

    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="loading-container">
      <div class="loading-spinner"></div>
      <p>Loading video...</p>
    </div>

    <!-- Rotate Phone Prompt -->
    <div id="rotatePrompt" class="rotate-prompt" style="display: none;">
      <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
        <rect x="6" y="4" width="12" height="16" rx="2"></rect>
        <path d="M9 1v2M15 1v2M9 21v2M15 21v2"></path>
      </svg>
      <p>Please rotate your device</p>
    </div>
  </div>

  <!-- QR Scanner Modal -->
  <div id="scannerModal" class="scanner-modal">
    <div class="scanner-overlay"></div>
    <div class="scanner-container">
      <div class="scanner-header">
        <h3>Scan QR Code</h3>
        <button id="closeScannerBtn" class="close-scanner-btn">&times;</button>
      </div>
      <div id="qrReader" class="qr-reader"></div>
      <p class="scanner-hint">Point your camera at a QR code</p>
    </div>
  </div>

  <script type="module">
    import { Html5Qrcode } from 'html5-qrcode';
    import { initializeErrorHandlers } from '/src/js/error-handler.js';

    // Initialize error handlers
    initializeErrorHandlers();

    const videoPlayer = document.getElementById('videoPlayer');
    const videoTitle = document.getElementById('videoTitle');
    const videoDescription = document.getElementById('videoDescription');
    const videoUrl = document.getElementById('videoUrl');
    const errorMessage = document.getElementById('errorMessage');
    const loadingIndicator = document.getElementById('loadingIndicator');
    const scanQrBtn = document.getElementById('scanQrBtn');
    const overlayQrBtn = document.getElementById('overlayQrBtn');
    const startOverlay = document.getElementById('startOverlay');
    const startVideoBtn = document.getElementById('startVideoBtn');
    const rotatePrompt = document.getElementById('rotatePrompt');
    const scannerModal = document.getElementById('scannerModal');
    const closeScannerBtn = document.getElementById('closeScannerBtn');

    let html5QrCode = null;
    let isVideoPlaying = false;

    // Get video info from query parameters
    const urlParams = new URLSearchParams(window.location.search);
    const initialVideoSrc = urlParams.get('video');
    const initialTitle = urlParams.get('title');
    const initialDescription = urlParams.get('description');

    if (initialVideoSrc) {
      loadVideo(
        decodeURIComponent(initialVideoSrc),
        initialTitle ? decodeURIComponent(initialTitle) : null,
        initialDescription ? decodeURIComponent(initialDescription) : null
      );
    } else {
      // No video URL provided
      loadingIndicator.style.display = 'none';
      errorMessage.style.display = 'flex';
      document.querySelector('.video-wrapper').style.display = 'none';
      document.querySelector('.video-info').style.display = 'none';
    }

    // Load video function
    function loadVideo(videoSrc, title = null, description = null) {
      // Show video wrapper and info
      document.querySelector('.video-wrapper').style.display = 'block';
      document.querySelector('.video-info').style.display = 'block';
      errorMessage.style.display = 'none';

      // Set video source
      videoPlayer.src = videoSrc;

      // Update title - use custom title if provided, otherwise extract from filename
      if (title) {
        videoTitle.textContent = title;
      } else {
        try {
          const url = new URL(videoSrc);
          const filename = url.pathname.split('/').pop();
          videoTitle.textContent = filename.replace(/\.[^/.]+$/, '').replace(/[-_]/g, ' ');
        } catch (e) {
          videoTitle.textContent = 'Video';
        }
      }

      // Update description - show if provided
      if (description) {
        videoDescription.textContent = description;
        videoDescription.style.display = 'block';
      } else {
        videoDescription.style.display = 'none';
      }

      // Update URL - only show if no custom title/description provided
      if (title || description) {
        videoUrl.style.display = 'none';
      } else {
        videoUrl.textContent = videoSrc;
        videoUrl.style.display = 'block';
      }

      // Play the video
      videoPlayer.play().catch(err => console.log('Play prevented:', err));
    }

    // Handle video load events
    videoPlayer.addEventListener('loadstart', () => {
      loadingIndicator.style.display = 'flex';
    });

    videoPlayer.addEventListener('loadeddata', () => {
      loadingIndicator.style.display = 'none';
    });

    videoPlayer.addEventListener('error', (e) => {
      loadingIndicator.style.display = 'none';
      errorMessage.style.display = 'flex';
      errorMessage.querySelector('h2').textContent = 'Error Loading Video';
      errorMessage.querySelector('p').textContent = 'The video could not be loaded. Please check the URL and try again.';
      document.querySelector('.video-wrapper').style.display = 'none';
      console.error('Video error:', e);
    });

    // Handle fullscreen
    const videoWrapper = document.querySelector('.video-wrapper');

    // Detect device type
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isAndroid = /Android/.test(navigator.userAgent);
    const isMobile = isIOS || isAndroid;

    console.log('Device detection:', { isIOS, isAndroid, isMobile });

    // Function to enter fullscreen with landscape orientation
    async function enterFullscreenLandscape() {
      console.log('Attempting fullscreen...');

      try {
        // iOS-specific: Use CSS fullscreen to keep overlay controls
        if (isIOS) {
          console.log('iOS detected - using CSS fullscreen to preserve overlays');

          // Add fullscreen class to wrapper for CSS-based fullscreen
          videoWrapper.classList.add('ios-fullscreen');
          document.body.classList.add('ios-fullscreen-active');

          // Try to lock orientation (may not work on iOS, but worth trying)
          if (screen.orientation && screen.orientation.lock) {
            try {
              await screen.orientation.lock('landscape');
              console.log('✓ iOS orientation locked');
            } catch (err) {
              console.log('⚠ iOS orientation lock not supported:', err.message);
            }
          }

          console.log('✓ iOS CSS fullscreen activated');
          return;
        }

        // Android and desktop - request fullscreen on wrapper
        if (videoWrapper.requestFullscreen) {
          await videoWrapper.requestFullscreen();
        } else if (videoWrapper.webkitRequestFullscreen) {
          await videoWrapper.webkitRequestFullscreen();
        } else if (videoWrapper.mozRequestFullScreen) {
          await videoWrapper.mozRequestFullScreen();
        } else if (videoWrapper.msRequestFullscreen) {
          await videoWrapper.msRequestFullscreen();
        }

        console.log('Fullscreen activated, attempting orientation lock...');

        // Lock to landscape orientation (Android and some desktop browsers)
        if (screen.orientation && screen.orientation.lock) {
          try {
            await screen.orientation.lock('landscape');
            console.log('✓ Orientation locked to landscape');
          } catch (err) {
            console.log('⚠ Orientation lock failed:', err.message);
            // Try alternative orientation lock
            try {
              await screen.orientation.lock('landscape-primary');
              console.log('✓ Orientation locked to landscape-primary');
            } catch (err2) {
              console.log('⚠ Alternative orientation lock failed:', err2.message);
            }
          }
        } else {
          console.log('⚠ Screen Orientation API not supported');
        }
      } catch (err) {
        console.log('❌ Fullscreen error:', err.message);
      }
    }

    // Function to exit fullscreen and unlock orientation
    async function exitFullscreenLandscape() {
      try {
        // iOS CSS fullscreen exit
        if (isIOS && videoWrapper.classList.contains('ios-fullscreen')) {
          videoWrapper.classList.remove('ios-fullscreen');
          document.body.classList.remove('ios-fullscreen-active');
          console.log('✓ iOS CSS fullscreen exited');
          return;
        }

        // Standard fullscreen exit
        if (document.exitFullscreen) {
          await document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          await document.webkitExitFullscreen();
        } else if (document.mozCancelFullScreen) {
          await document.mozCancelFullScreen();
        } else if (document.msExitFullscreen) {
          await document.msExitFullscreen();
        }

        // Unlock orientation
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
          console.log('Orientation unlocked');
        }
      } catch (err) {
        console.log('Exit fullscreen error:', err);
      }
    }

    // Handle orientation changes
    function checkOrientation() {
      if (!isMobile || !isVideoPlaying) return;

      const isPortrait = window.innerHeight > window.innerWidth;
      const isIOSFullscreen = videoWrapper.classList.contains('ios-fullscreen');
      const isFullscreen = !!(isIOSFullscreen || document.fullscreenElement || document.webkitFullscreenElement ||
                              document.mozFullScreenElement || document.msFullscreenElement ||
                              videoPlayer.webkitDisplayingFullscreen);

      console.log('Orientation check:', { isPortrait, isFullscreen, isVideoPlaying, isIOSFullscreen });

      // Show rotation prompt if in portrait and video is playing
      if (isPortrait && isFullscreen && isVideoPlaying) {
        rotatePrompt.style.display = 'flex';
      } else {
        rotatePrompt.style.display = 'none';
      }
    }

    // Listen for orientation changes
    window.addEventListener('orientationchange', () => {
      console.log('Orientation changed');
      setTimeout(checkOrientation, 300);
    });

    window.addEventListener('resize', () => {
      checkOrientation();
    });

    // Start Video button - user interaction triggers fullscreen
    startVideoBtn.addEventListener('click', async () => {
      // Hide start overlay and show QR button
      startOverlay.style.display = 'none';
      overlayQrBtn.style.display = 'flex';
      isVideoPlaying = true;

      // Enter fullscreen with landscape orientation
      await enterFullscreenLandscape();

      // Play the video
      try {
        await videoPlayer.play();
        checkOrientation();
      } catch (err) {
        console.log('Play error:', err);
      }
    });

    // Double-click to toggle fullscreen
    videoPlayer.addEventListener('dblclick', () => {
      // Check iOS CSS fullscreen
      const isIOSFullscreen = videoWrapper.classList.contains('ios-fullscreen');

      if (isIOSFullscreen || document.fullscreenElement || document.webkitFullscreenElement ||
          document.mozFullScreenElement || document.msFullscreenElement) {
        exitFullscreenLandscape();
      } else {
        enterFullscreenLandscape();
      }
    });

    // Handle fullscreen change events (when user exits fullscreen manually)
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
      }
    });

    document.addEventListener('webkitfullscreenchange', () => {
      if (!document.webkitFullscreenElement) {
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
      }
    });

    // QR Scanner functionality
    scanQrBtn.addEventListener('click', openScanner);
    overlayQrBtn.addEventListener('click', openScanner);
    closeScannerBtn.addEventListener('click', closeScanner);

    // Close on overlay click
    scannerModal.querySelector('.scanner-overlay').addEventListener('click', closeScanner);

    async function openScanner() {
      scannerModal.classList.add('active');

      try {
        html5QrCode = new Html5Qrcode('qrReader');

        await html5QrCode.start(
          { facingMode: 'environment' },
          {
            fps: 10,
            qrbox: { width: 250, height: 250 }
          },
          onScanSuccess,
          onScanError
        );
      } catch (err) {
        console.error('Error starting scanner:', err);
        alert('Unable to access camera. Please check permissions.');
        closeScanner();
      }
    }

    async function closeScanner() {
      if (html5QrCode) {
        try {
          await html5QrCode.stop();
          html5QrCode.clear();
        } catch (err) {
          console.error('Error stopping scanner:', err);
        }
        html5QrCode = null;
      }
      scannerModal.classList.remove('active');
    }

    function onScanSuccess(decodedText, decodedResult) {
      console.log('QR Code detected:', decodedText);

      // Extract video info from the scanned text
      let videoInfo = extractVideoInfo(decodedText);

      if (videoInfo) {
        // Close scanner and load new video
        closeScanner();
        loadVideo(videoInfo.url, videoInfo.title, videoInfo.description);
      }
    }

    function onScanError(error) {
      // Ignore scan errors (they happen frequently while scanning)
    }

    function extractVideoInfo(scannedText) {
      try {
        // Check if it's a player URL with video parameter
        const url = new URL(scannedText);
        const videoParam = url.searchParams.get('video');

        if (videoParam) {
          // It's a player URL, extract the video parameter and metadata
          const title = url.searchParams.get('title');
          const description = url.searchParams.get('description');

          return {
            url: decodeURIComponent(videoParam),
            title: title ? decodeURIComponent(title) : null,
            description: description ? decodeURIComponent(description) : null
          };
        } else if (scannedText.toLowerCase().endsWith('.mp4')) {
          // It's a direct MP4 URL
          return { url: scannedText, title: null, description: null };
        } else {
          // Not a recognized video URL
          alert('QR code does not contain a valid video URL');
          return null;
        }
      } catch (e) {
        // If it's not a URL, check if it ends with .mp4
        if (scannedText.toLowerCase().endsWith('.mp4')) {
          return { url: scannedText, title: null, description: null };
        }
        alert('QR code does not contain a valid video URL');
        return null;
      }
    }
  </script>

  <!-- Footer -->
  <footer class="main-footer">
    <div class="footer-content">
      <p>© 2025 TinyDarkForge. All rights reserved.</p>

        <a href="mailto:hello@tinydarkforge.com">Support</a>
      </div>
    </div>
  </footer>
</body>
</html>
