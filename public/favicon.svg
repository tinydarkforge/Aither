<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" fill="#0b2a37"/>

  <!-- QR Code Pattern - Top Left Corner -->
  <rect x="4" y="4" width="3" height="3" fill="#0ea5b7"/>
  <rect x="8" y="4" width="3" height="3" fill="#0ea5b7"/>
  <rect x="4" y="8" width="3" height="3" fill="#0ea5b7"/>
  <rect x="8" y="8" width="3" height="3" fill="#0ea5b7"/>

  <!-- QR Code Pattern - Top Right Corner -->
  <rect x="53" y="4" width="3" height="3" fill="#0ea5b7"/>
  <rect x="57" y="4" width="3" height="3" fill="#0ea5b7"/>
  <rect x="53" y="8" width="3" height="3" fill="#0ea5b7"/>
  <rect x="57" y="8" width="3" height="3" fill="#0ea5b7"/>

  <!-- QR Code Pattern - Bottom Left Corner -->
  <rect x="4" y="53" width="3" height="3" fill="#0ea5b7"/>
  <rect x="8" y="53" width="3" height="3" fill="#0ea5b7"/>
  <rect x="4" y="57" width="3" height="3" fill="#0ea5b7"/>
  <rect x="8" y="57" width="3" height="3" fill="#0ea5b7"/>

  <!-- Additional QR dots for authenticity -->
  <rect x="14" y="6" width="2" height="2" fill="#0ea5b7" opacity="0.7"/>
  <rect x="18" y="6" width="2" height="2" fill="#0ea5b7" opacity="0.7"/>
  <rect x="44" y="6" width="2" height="2" fill="#0ea5b7" opacity="0.7"/>
  <rect x="48" y="6" width="2" height="2" fill="#0ea5b7" opacity="0.7"/>
  <rect x="6" y="14" width="2" height="2" fill="#0ea5b7" opacity="0.7"/>
  <rect x="6" y="18" width="2" height="2" fill="#0ea5b7" opacity="0.7"/>
  <rect x="6" y="44" width="2" height="2" fill="#0ea5b7" opacity="0.7"/>
  <rect x="6" y="48" width="2" height="2" fill="#0ea5b7" opacity="0.7"/>
  <rect x="56" y="14" width="2" height="2" fill="#0ea5b7" opacity="0.7"/>
  <rect x="56" y="18" width="2" height="2" fill="#0ea5b7" opacity="0.7"/>
  <rect x="14" y="56" width="2" height="2" fill="#0ea5b7" opacity="0.7"/>
  <rect x="18" y="56" width="2" height="2" fill="#0ea5b7" opacity="0.7"/>

  <!-- Large "A" in the center -->
  <text
    x="32"
    y="48"
    font-family="Arial, sans-serif"
    font-size="42"
    font-weight="bold"
    fill="#0ea5b7"
    text-anchor="middle">A</text>
</svg>
